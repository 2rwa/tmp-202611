<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>NEON BREAK — ブロック崩し</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px 14px; color: #f1f5ff; background: radial-gradient(ellipse at 50% 0%, #1d2854 0%, #0b1020 58%, #070b16 100%); }
    .shell { width: min(100%, 850px); }
    header { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: .11em; font-weight: 850; }
    h1 span { color: #63eeeb; }
    .subtitle { margin: 4px 0 0; color: #9caad0; font-size: .85rem; }
    .scores { display: flex; gap: 10px; }
    .score { background: #19233c; padding: 8px 14px; border: 1px solid #354263; border-radius: 12px; min-width: 80px; text-align: center; }
    .score small { display: block; color: #a7b7d7; font-size: .69rem; letter-spacing: .08em; }
    .score strong { font-variant-numeric: tabular-nums; font-size: 1.12rem; }
    .frame { border: 1px solid #344363; border-radius: 18px; overflow: hidden; background: #0d1529; box-shadow: 0 20px 72px #0006, inset 0 0 0 1px #ffffff0b; }
    canvas { width: 100%; aspect-ratio: 800 / 520; height: auto; display: block; touch-action: none; cursor: crosshair; }
    .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-top: 14px; }
    .hint { color: #aab8d7; font-size: .81rem; line-height: 1.6; }
    .controls { display: flex; gap: 8px; }
    button { appearance: none; border: 1px solid #586889; padding: 10px 17px; background: #1d2944; color: #e9f1ff; border-radius: 10px; font-weight: 720; font-size: .86rem; cursor: pointer; }
    button:hover { background: #283857; }
    button.primary { border-color: #77e9de; background: #5adbd4; color: #092331; }
    button.primary:hover { background: #8ff8ed; }
    button:focus-visible { outline: 3px solid #f6d886; outline-offset: 3px; }
    .footer { margin-top: 9px; color: #7989ac; font-size: .76rem; }
    @media (max-width: 620px) { .score { min-width: 70px; padding: 6px 9px; } header { align-items: start; } .bar { justify-content: center; } .hint { text-align: center; width: 100%; } .footer { text-align: center; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>NEON <span>BREAK</span></h1><p class="subtitle">ちょっと光るブロック崩し</p></div>
      <div class="scores">
        <div class="score"><small>SCORE</small><strong id="score">0</strong></div>
        <div class="score"><small>BEST</small><strong id="best">0</strong></div>
        <div class="score"><small>LEVEL</small><strong id="level">1</strong></div>
        <div class="score"><small>LIVES</small><strong id="lives">♥ ♥ ♥</strong></div>
      </div>
    </header>
    <div class="frame"><canvas id="game" width="800" height="520" role="img" aria-label="ブロック崩しのゲーム画面。左右キー、マウス、タッチでパドルを操作します。"></canvas></div>
    <div class="bar">
      <div class="hint">← → / A D / マウス・タッチで移動　•　スペースで開始・再開　•　Pで一時停止</div>
      <div class="controls"><button class="primary" id="start">スタート</button><button id="pause">一時停止</button><button id="reset">最初から</button></div>
    </div>
    <div class="footer">全ブロックを消すと次のレベルへ。3回落としたらゲームオーバー。</div>
  </main>
  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const els = Object.fromEntries(['score','best','level','lives','start','pause','reset'].map(id => [id, document.getElementById(id)]));
    const colors = ['#54e7de','#57a8ff','#a68cff','#ec83c9','#ffb86f','#f6db82','#7fe6a6'];
    const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
    let best = 0;
    try { best = Number(localStorage.getItem('neonBreakBest')) || 0; } catch (_) {}
    let score=0,level=1,lives=3,state='ready', last=0;
    let left=false,right=false,pointerX=null;
    let particles=[], trails=[];
    const paddle={x:354,y:480,w:92,h:13};
    const ball={x:400,y:467,vx:180,vy:-330,r:7};
    let bricks=[];
    const stars=Array.from({length:48},(_,i)=>({x:(i*173+57)%W,y:(i*101+23)%H,r:i%5===0?1.3:0.75}));

    function syncUI(){
      els.score.textContent=score.toLocaleString('ja-JP');
      els.best.textContent=best.toLocaleString('ja-JP');
      els.level.textContent=level;
      els.lives.textContent='♥ '.repeat(lives).trim() || '—';
      els.start.textContent=state==='playing'?'プレイ中':state==='paused'?'再開':state==='ready'?'スタート':'もう一度';
      els.pause.textContent=state==='paused'?'再開':'一時停止';
    }
    function newBricks(){
      bricks=[];
      const cols=10, rows=Math.min(4+level,7), gap=8, margin=37, bw=(W-margin*2-gap*(cols-1))/cols, bh=24;
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
        const hp=level>=3&&r===0?2:1;
        bricks.push({x:margin+c*(bw+gap),y:70+r*(bh+9),w:bw,h:bh,hp,maxHp:hp,color:colors[r%colors.length]});
      }
    }
    function resetBall(){
      paddle.x=(W-paddle.w)/2;
      ball.x=paddle.x+paddle.w/2; ball.y=paddle.y-ball.r-2;
      const speed=Math.min(360+level*24,505);
      ball.vx=speed*.48*(Math.random()>.5?1:-1);ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx);
      trails=[];
    }
    function restart(){score=0;level=1;lives=3;particles=[];state='ready';newBricks();resetBall();syncUI();}
    function nextLevel(){level++;newBricks();resetBall();state='ready';syncUI();}
    function start(){
      if(state==='playing')return;
      if(state==='gameover'||state==='won')restart();
      state='playing';syncUI();
    }
    function togglePause(){
      if(state==='playing')state='paused'; else if(state==='paused')state='playing'; else if(state==='ready')state='playing';
      syncUI();
    }
    function addScore(points){
      score+=points;
      if(score>best){best=score;try{localStorage.setItem('neonBreakBest',String(best));}catch(_){}}
      syncUI();
    }
    function pop(x,y,color,n=9){
      for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=45+Math.random()*135;
        particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.35+Math.random()*.35,color});}
    }
    function circleRect(b,r){const cx=clamp(b.x,r.x,r.x+r.w),cy=clamp(b.y,r.y,r.y+r.h);const dx=b.x-cx,dy=b.y-cy;return dx*dx+dy*dy<b.r*b.r;}
    function update(dt){
      if(pointerX!==null){paddle.x+=(clamp(pointerX-paddle.w/2,5,W-paddle.w-5)-paddle.x)*Math.min(1,dt*18);}
      else {const dir=(right?1:0)-(left?1:0);paddle.x=clamp(paddle.x+dir*580*dt,5,W-paddle.w-5);}
      particles=particles.filter(p=>p.t<p.life);
      for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;}
      if(state!=='playing'){
        if(state==='ready'){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;}
        return;
      }
      const steps=Math.max(1,Math.ceil(dt/(1/180))),s=dt/steps;
      for(let j=0;j<steps;j++){
        const prevX=ball.x,prevY=ball.y;
        ball.x+=ball.vx*s;ball.y+=ball.vy*s;
        if(ball.x-ball.r<8){ball.x=8+ball.r;ball.vx=Math.abs(ball.vx);}
        if(ball.x+ball.r>W-8){ball.x=W-8-ball.r;ball.vx=-Math.abs(ball.vx);}
        if(ball.y-ball.r<8){ball.y=8+ball.r;ball.vy=Math.abs(ball.vy);}
        if(ball.vy>0&&circleRect(ball,paddle)&&prevY+ball.r<=paddle.y+9){
          ball.y=paddle.y-ball.r-.1;
          let speed=Math.min(Math.hypot(ball.vx,ball.vy)*1.015,720);
          const frac=clamp((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2),-1,1);
          ball.vx=speed*Math.sin(frac*1.13);
          ball.vy=-Math.abs(speed*Math.cos(frac*1.13));
          pop(ball.x,paddle.y,'#69f4e9',5);
        }
        for(let i=bricks.length-1;i>=0;i--){
          const b=bricks[i];if(!circleRect(ball,b))continue;
          const priorOutsideX=prevX+ball.r<=b.x||prevX-ball.r>=b.x+b.w;
          const priorOutsideY=prevY+ball.r<=b.y||prevY-ball.r>=b.y+b.h;
          if(priorOutsideX&&!priorOutsideY)ball.vx*=-1;
          else if(priorOutsideY&&!priorOutsideX)ball.vy*=-1;
          else {
            const ox=Math.min(Math.abs(ball.x+ball.r-b.x),Math.abs(b.x+b.w-(ball.x-ball.r)));
            const oy=Math.min(Math.abs(ball.y+ball.r-b.y),Math.abs(b.y+b.h-(ball.y-ball.r)));
            if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
          }
          b.hp--;addScore(b.hp===0?10*level:5*level);pop(ball.x,ball.y,b.color,b.hp===0?11:5);
          if(b.hp<=0)bricks.splice(i,1);
          break;
        }
        if(ball.y-ball.r>H){
          lives--;pop(ball.x,H-10,'#ff849b',20);
          if(lives<=0){state='gameover';}
          else {state='ready';resetBall();}
          syncUI();break;
        }
        if(bricks.length===0){addScore(100*level);nextLevel();break;}
      }
      trails.push({x:ball.x,y:ball.y,t:0});if(trails.length>12)trails.shift();
      for(const t of trails)t.t+=dt;
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
    function draw(){
      const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101c36');bg.addColorStop(1,'#0a1427');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#29416938';ctx.lineWidth=1;
      for(let x=20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=20;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      for(const s of stars){ctx.fillStyle='#96c8ff55';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
      ctx.shadowBlur=13;
      for(const b of bricks){
        ctx.shadowColor=b.color;ctx.fillStyle=b.color;roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle='#ffffff48';roundRect(b.x+4,b.y+3,b.w-8,3,2);ctx.fill();
        if(b.hp>1){ctx.strokeStyle='#ffffffa0';ctx.lineWidth=1.5;roundRect(b.x+4,b.y+4,b.w-8,b.h-8,3);ctx.stroke();}
        ctx.shadowBlur=13;
      }
      ctx.shadowBlur=17;ctx.shadowColor='#5de9e2';
      const pgrad=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);pgrad.addColorStop(0,'#b9fff4');pgrad.addColorStop(1,'#39c5d5');
      ctx.fillStyle=pgrad;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;
      if(state==='playing'||state==='ready'){
        for(let i=0;i<trails.length;i++){const t=trails[i];ctx.fillStyle=`rgba(103,236,232,${(i/trails.length)*.22})`;ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(.3+i/trails.length*.55),0,Math.PI*2);ctx.fill();}
      }
      ctx.shadowColor='#c1fbff';ctx.shadowBlur=22;ctx.fillStyle='#f4ffff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      for(const p of particles){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.7,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
      if(state!=='playing'){
        ctx.fillStyle='#071225bd';ctx.fillRect(0,0,W,H);
        let title='',hint='',small='';
        if(state==='ready'){title=level===1&&score===0?'READY?':`LEVEL ${level}`;hint='スペース / クリックでスタート';small='ブロックを全部消そう';}
        if(state==='paused'){title='PAUSED';hint='スペース / クリックで再開';small='';}
        if(state==='gameover'){title='GAME OVER';hint='クリックでリトライ';small=`SCORE ${score.toLocaleString('ja-JP')}`;}
        if(state==='won'){title='CLEAR!';hint='クリックでリトライ';small=`SCORE ${score.toLocaleString('ja-JP')}`;}
        ctx.textAlign='center';ctx.fillStyle='#f2fbff';ctx.font='800 49px system-ui, sans-serif';ctx.fillText(title,W/2,H/2-22);
        ctx.font='600 21px system-ui, sans-serif';ctx.fillStyle='#7deae5';ctx.fillText(hint,W/2,H/2+23);
        ctx.font='16px system-ui, sans-serif';ctx.fillStyle='#b6c7e4';ctx.fillText(small,W/2,H/2+57);
      }
    }
    function frame(now){let dt=last?Math.min((now-last)/1000,.033):1/60;last=now;update(dt);draw();requestAnimationFrame(frame);}
    function position(e){const r=canvas.getBoundingClientRect();pointerX=clamp((e.clientX-r.left)/r.width*W,0,W);}
    canvas.addEventListener('pointermove',e=>{position(e);});
    canvas.addEventListener('pointerdown',e=>{position(e);try{canvas.setPointerCapture(e.pointerId);}catch(_){}if(state!=='playing')start();});
    canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')pointerX=null;});
    window.addEventListener('keydown',e=>{
      if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyP','KeyR'].includes(e.code))e.preventDefault();
      if(e.code==='ArrowLeft'||e.code==='KeyA'){left=true;pointerX=null;}
      if(e.code==='ArrowRight'||e.code==='KeyD'){right=true;pointerX=null;}
      if(e.code==='Space'){if(state==='playing')togglePause();else start();}
      if(e.code==='KeyP')togglePause();
      if(e.code==='KeyR')restart();
    });
    window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')left=false;if(e.code==='ArrowRight'||e.code==='KeyD')right=false;});
    window.addEventListener('blur',()=>{left=false;right=false;if(state==='playing'){state='paused';syncUI();}});
    els.start.addEventListener('click',()=>{if(state==='playing')return;start();});
    els.pause.addEventListener('click',togglePause);
    els.reset.addEventListener('click',restart);
    restart();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
