<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e20">
<title>ORBIT BREAK — 円形アリーナのブロック崩し</title>
<link rel="stylesheet" href="../orbit/style.css">
</head>
<body>
<main class="shell">
 <header>
  <div><p class="eyebrow"><a href="../index.html">NEON BREAK LAB</a> / EXPERIMENT 05</p><h1>ORBIT <em>BREAK</em></h1><p class="subtitle">外周で反射、内側で破壊。背面からパドルに当たるとミス。</p></div>
  <div class="scores" aria-label="スコアと進行状況">
   <div class="score"><small>SCORE</small><strong id="score">0</strong></div>
   <div class="score"><small>BEST</small><strong id="best">0</strong></div>
   <div class="score"><small>STAGE</small><strong id="level">1</strong></div>
   <div class="score"><small>LIVES</small><strong id="lives">♥♥♥</strong></div>
  </div>
 </header>
 <div class="arena-wrap"><canvas id="arena" width="800" height="600" role="img" aria-label="円形フィールドを漂う図形をボールで壊すゲーム。パドルの内側は反射、背面はアウト。"></canvas></div>
 <div class="toolbar">
  <div class="instructions"><span>← → / A D / マウス・タッチ：パドルを円周に沿って移動</span><span>SPACE：開始・一時停止 / P：一時停止 / R：リセット</span></div>
  <div class="buttons"><button class="primary" id="start">スタート</button><button id="pause">一時停止</button><button id="reset">リセット</button></div>
 </div>
 <div class="info">
  <div class="legend"><span class="cyan">●</span> パドル内側：反射 <span class="pink">●</span> パドル背面：ミス（3回でゲームオーバー）</div>
  <div class="progress">状態 <b id="status">READY</b> <span class="bullet">·</span> 残りターゲット <b id="remaining">0</b></div>
 </div>
 <footer><a href="../index.html">← バージョン一覧に戻る</a><span>すべての反射角は衝突面の法線から計算。球速はステージ内で一定です。</span></footer>
</main>
<script src="../orbit/physics.js"></script>
<script src="../orbit/render.js"></script>
<script src="../orbit/game.js"></script>
</body>
</html>
