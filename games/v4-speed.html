<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>NEON BREAK — 図形ブロック崩し</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px 14px;
      color: #f1f5ff;
      background: radial-gradient(ellipse at 50% 0%, #1d2854 0%, #0b1020 58%, #070b16 100%);
    }
    .shell { width: min(100%, 850px); }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
    }
    h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: .11em; font-weight: 850; }
    h1 span { color: #63eeeb; }
    .subtitle { margin: 4px 0 0; color: #9caad0; font-size: .85rem; }
    .scores { display: flex; gap: 10px; }
    .score {
      background: #19233c;
      padding: 8px 14px;
      border: 1px solid #354263;
      border-radius: 12px;
      min-width: 80px;
      text-align: center;
    }
    .score small { display: block; color: #a7b7d7; font-size: .69rem; letter-spacing: .08em; }
    .score strong { font-variant-numeric: tabular-nums; font-size: 1.12rem; }
    .frame {
      border: 1px solid #344363;
      border-radius: 18px;
      overflow: hidden;
      background: #0d1529;
      box-shadow: 0 20px 72px #0006, inset 0 0 0 1px #ffffff0b;
    }
    canvas {
      width: 100%;
      aspect-ratio: 800 / 520;
      height: auto;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-top: 14px;
    }
    .hint { color: #aab8d7; font-size: .81rem; line-height: 1.6; }
    .controls { display: flex; gap: 8px; }
    button {
      appearance: none;
      border: 1px solid #586889;
      padding: 10px 17px;
      background: #1d2944;
      color: #e9f1ff;
      border-radius: 10px;
      font-weight: 720;
      font-size: .86rem;
      cursor: pointer;
    }
    button:hover { background: #283857; }
    button.primary { border-color: #77e9de; background: #5adbd4; color: #092331; }
    button.primary:hover { background: #8ff8ed; }
    button:focus-visible { outline: 3px solid #f6d886; outline-offset: 3px; }
    .footer { margin-top: 9px; color: #7989ac; font-size: .76rem; }
    @media (max-width: 620px) {
      .score { min-width: 70px; padding: 6px 9px; }
      header { align-items: start; }
      .bar { justify-content: center; }
      .hint { text-align: center; width: 100%; }
      .footer { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>NEON <span>BREAK</span></h1>
        <p class="subtitle">散らばる図形ブロック + 楕円パドル + 法線反射</p>
      </div>
      <div class="scores">
        <div class="score"><small>SCORE</small><strong id="score">0</strong></div>
        <div class="score"><small>BEST</small><strong id="best">0</strong></div>
        <div class="score"><small>LEVEL</small><strong id="level">1</strong></div>
        <div class="score"><small>LIVES</small><strong id="lives">♥ ♥ ♥</strong></div>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" width="800" height="520" role="img" aria-label="ブロック崩しのゲーム画面。左右キー、マウス、タッチでパドルを操作します。"></canvas>
    </div>
    <div class="bar">
      <div class="hint">← → / A D / マウス・タッチで移動　•　スペースで開始・再開　•　Pで一時停止</div>
      <div class="controls">
        <button class="primary" id="start">スタート</button>
        <button id="pause">一時停止</button>
        <button id="reset">最初から</button>
      </div>
    </div>
    <div class="footer">丸・三角・四角のブロック。接触面の法線で反射し、ボールの速さはレベル内で一定。パドルを動かしても急加速しません。</div>
  </main>
  <script>
  (() => {
    'use strict';

    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const els = Object.fromEntries(['score','best','level','lives','start','pause','reset'].map(id => [id, document.getElementById(id)]));

    const colors = ['#54e7de','#57a8ff','#a68cff','#ec83c9','#ffb86f','#f6db82','#7fe6a6'];
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const len = (x, y) => Math.hypot(x, y);
    const normalize = (x, y) => {
      const l = Math.hypot(x, y) || 1;
      return { x: x / l, y: y / l };
    };
    const reflect = (vx, vy, nx, ny) => {
      const dot = vx * nx + vy * ny;
      return { vx: vx - 2 * dot * nx, vy: vy - 2 * dot * ny };
    };
    const pointInTriangle = (px, py, a, b, c) => {
      const s1 = (px - c.x) * (b.y - c.y) - (b.x - c.x) * (py - c.y);
      const s2 = (px - a.x) * (c.y - a.y) - (c.x - a.x) * (py - a.y);
      const s3 = (px - b.x) * (a.y - b.y) - (a.x - b.x) * (py - b.y);
      const hasNeg = s1 < 0 || s2 < 0 || s3 < 0;
      const hasPos = s1 > 0 || s2 > 0 || s3 > 0;
      return !(hasNeg && hasPos);
    };
    const closestPointOnSegment = (px, py, ax, ay, bx, by) => {
      const dx = bx - ax, dy = by - ay;
      const denom = dx * dx + dy * dy || 1;
      const t = clamp(((px - ax) * dx + (py - ay) * dy) / denom, 0, 1);
      return { x: ax + dx * t, y: ay + dy * t, t };
    };

    let best = 0;
    try { best = Number(localStorage.getItem('neonBreakBest')) || 0; } catch (_) {}

    let score = 0;
    let level = 1;
    let lives = 3;
    let state = 'ready';
    let last = 0;
    let left = false;
    let right = false;
    let pointerX = null;
    let particles = [];
    let trails = [];
    let bricks = [];

    // ゲーム性を優先し、速度はレベル単位で一定にする。
    // 速度変化はヒット数やパドル移動速度からは生じさせない。
    const levelSpeed = () => Math.min(350 + (level - 1) * 18, 470);
    const paddleSpin = 0.16; // パドルを動かした場合の反射方向への影響（速度への影響はなし）
    const paddleSpinMax = 420;
    const minUpwardFraction = 0.24; // 水平飛行・下向き跳ね返りを避ける
    const paddle = { x: 334, y: 472, w: 132, h: 28, rx: 66, ry: 14 };
    const ball = { x: 400, y: 458, vx: 195, vy: -330, r: 7 };
    const stars = Array.from({ length: 48 }, (_, i) => ({ x: (i * 173 + 57) % W, y: (i * 101 + 23) % H, r: i % 5 === 0 ? 1.3 : 0.75 }));

    function syncUI() {
      els.score.textContent = score.toLocaleString('ja-JP');
      els.best.textContent = best.toLocaleString('ja-JP');
      els.level.textContent = level;
      els.lives.textContent = '♥ '.repeat(lives).trim() || '—';
      els.start.textContent = state === 'playing' ? 'プレイ中' : state === 'paused' ? '再開' : state === 'ready' ? 'スタート' : 'もう一度';
      els.pause.textContent = state === 'paused' ? '再開' : '一時停止';
    }

    function updatePaddleShape() {
      paddle.rx = paddle.w / 2;
      paddle.ry = paddle.h / 2;
    }

    // 固定シードの配置。ゲーム内容は再現可能で、反射に乱数は使わない。
    function seededRandom(seed) {
      let x = seed >>> 0;
      return () => {
        x = (Math.imul(1664525, x) + 1013904223) >>> 0;
        return x / 4294967296;
      };
    }

    function newBricks() {
      bricks = [];
      const rand = seededRandom(0x2bc9a5 + level * 15427);
      const cols = 15;
      const rows = Math.min(6 + Math.floor(level / 2), 8);
      const shapes = ['circle', 'triangle', 'rect'];

      // 小さな図形を、マス目の中で揺らしながら疎らに配置する。
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (rand() < (r % 3 === 0 ? 0.23 : 0.34)) continue;
          const shape = shapes[Math.floor(rand() * shapes.length)];
          const size = 23 + rand() * 7;
          const w = size;
          const h = size;
          const x = 40 + c * 50 + (rand() - 0.5) * 11;
          const y = 56 + r * 43 + (rand() - 0.5) * 10;
          const hp = level >= 3 && rand() < 0.12 ? 2 : 1;
          bricks.push({
            x, y, w, h, hp, maxHp: hp,
            color: colors[(r * 2 + c + level) % colors.length],
            shape,
            // 0°,45°,90°...315°。斜面がさまざまな方向を向く。
            rotation: Math.floor(rand() * 8) * Math.PI / 4
          });
        }
      }
    }

    function resetBall() {
      paddle.x = (W - paddle.w) / 2;
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 1;
      const speed = levelSpeed();
      const angle = -Math.PI / 2 + (level % 2 === 0 ? 0.18 : -0.18);
      ball.vx = Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
      trails = [];
    }

    function restart() {
      score = 0;
      level = 1;
      lives = 3;
      particles = [];
      state = 'ready';
      newBricks();
      resetBall();
      syncUI();
    }

    function nextLevel() {
      level++;
      newBricks();
      resetBall();
      state = 'ready';
      syncUI();
    }

    function start() {
      if (state === 'playing') return;
      if (state === 'gameover' || state === 'won') restart();
      state = 'playing';
      syncUI();
    }

    function togglePause() {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
      else if (state === 'ready') state = 'playing';
      syncUI();
    }

    function addScore(points) {
      score += points;
      if (score > best) {
        best = score;
        try { localStorage.setItem('neonBreakBest', String(best)); } catch (_) {}
      }
      syncUI();
    }

    function pop(x, y, color, n = 9) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = 45 + Math.random() * 135;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: .35 + Math.random() * .35, color });
      }
    }

    function keepBallSpeed() {
      // 反射では方向だけ変える。毎回レベル固定速度へ正規化する。
      const n = normalize(ball.vx, ball.vy);
      const speed = levelSpeed();
      ball.vx = n.x * speed;
      ball.vy = n.y * speed;
    }

    function keepPaddleBounceUpward() {
      // 楕円の側面で生じる下向き・水平の跳ね返りはゲーム用に補正する。
      // 角度は計算された方向を使い、必要なときだけ上向き成分を制限する。
      const speed = levelSpeed();
      const minUpward = speed * minUpwardFraction;
      if (ball.vy > -minUpward) {
        const sign = ball.vx < 0 ? -1 : 1;
        ball.vy = -minUpward;
        ball.vx = sign * Math.sqrt(speed * speed - minUpward * minUpward);
      } else {
        keepBallSpeed();
      }
    }

    function resolveWallCollision() {
      let bounced = false;
      if (ball.x - ball.r < 8) {
        ball.x = 8 + ball.r;
        const out = reflect(ball.vx, ball.vy, 1, 0);
        ball.vx = out.vx; ball.vy = out.vy;
        bounced = true;
      }
      if (ball.x + ball.r > W - 8) {
        ball.x = W - 8 - ball.r;
        const out = reflect(ball.vx, ball.vy, -1, 0);
        ball.vx = out.vx; ball.vy = out.vy;
        bounced = true;
      }
      if (ball.y - ball.r < 8) {
        ball.y = 8 + ball.r;
        const out = reflect(ball.vx, ball.vy, 0, 1);
        ball.vx = out.vx; ball.vy = out.vy;
        bounced = true;
      }
      if (bounced) keepBallSpeed();
    }

    // 点から楕円への最近接点。楕円の厳密な境界上の点を求める。
    // 楕円外の点ではラグランジュ乗数の単調方程式を二分探索する。
    function closestEllipsePoint(dx, dy, a, b) {
      const aa = a * a, bb = b * b;
      const q = dx * dx / aa + dy * dy / bb;
      if (q >= 1) {
        const f = t => (a * dx / (aa + t)) ** 2 + (b * dy / (bb + t)) ** 2 - 1;
        let low = 0, high = 1;
        while (f(high) > 0) high *= 2;
        for (let i = 0; i < 42; i++) {
          const mid = (low + high) / 2;
          if (f(mid) > 0) low = mid;
          else high = mid;
        }
        const t = (low + high) / 2;
        return { x: aa * dx / (aa + t), y: bb * dy / (bb + t), inside: false };
      }

      // 中心が内側に進入した場合も、上半分の最短距離点へ押し戻せるようにする。
      // 64サンプルで候補を選び、局所的に黄金分割探索で絞る。
      const dist2 = t => {
        const x = a * Math.cos(t), y = -b * Math.sin(t);
        return (x - dx) ** 2 + (y - dy) ** 2;
      };
      let best = 0, minimum = Infinity;
      for (let i = 0; i <= 64; i++) {
        const t = Math.PI * i / 64;
        const d = dist2(t);
        if (d < minimum) { minimum = d; best = t; }
      }
      let lo = Math.max(0, best - Math.PI / 64);
      let hi = Math.min(Math.PI, best + Math.PI / 64);
      const phi = (Math.sqrt(5) - 1) / 2;
      for (let i = 0; i < 32; i++) {
        const m1 = hi - phi * (hi - lo);
        const m2 = lo + phi * (hi - lo);
        if (dist2(m1) < dist2(m2)) hi = m2;
        else lo = m1;
      }
      const t = (lo + hi) / 2;
      return { x: a * Math.cos(t), y: -b * Math.sin(t), inside: true };
    }

    function collideBallPaddle(paddleVX) {
      const cx = paddle.x + paddle.rx;
      const cy = paddle.y + paddle.ry;
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      const a = paddle.rx, b = paddle.ry;
      const r = ball.r;
      if (Math.abs(dx) > a + r || Math.abs(dy) > b + r) return false;
      // パドルの裏側では反射させない。
      if (ball.y > cy + 1) return false;

      const cp = closestEllipsePoint(dx, dy, a, b);
      const distance = Math.hypot(dx - cp.x, dy - cp.y);
      if (!cp.inside && distance > r) return false;

      // 楕円 x²/a²+y²/b²=1 の勾配が接触面の法線。
      const n = normalize(cp.x / (a * a), cp.y / (b * b));
      // 接触面からボール半径ぶん外側に配置。食い込みを必ず解消する。
      ball.x = cx + cp.x + n.x * (r + 0.25);
      ball.y = cy + cp.y + n.y * (r + 0.25);

      // 接触面の法線で計算する。パドル移動は方向だけに限定して影響する。
      // パドル速度をそのまま加え戻すと異常な加速の原因になるためしない。
      const influence = clamp(paddleVX, -paddleSpinMax, paddleSpinMax) * paddleSpin;
      const rvx = ball.vx - influence;
      const rvy = ball.vy;
      const approach = rvx * n.x + rvy * n.y;
      if (approach < -0.001) {
        const out = reflect(rvx, rvy, n.x, n.y);
        ball.vx = out.vx + influence;
        ball.vy = out.vy;
        keepBallSpeed();
        keepPaddleBounceUpward();
        pop(ball.x, ball.y, '#69f4e9', 5);
      }
      return true;
    }

    function getRectCollision(b) {
      const nearestX = clamp(ball.x, b.x, b.x + b.w);
      const nearestY = clamp(ball.y, b.y, b.y + b.h);
      const dx = ball.x - nearestX;
      const dy = ball.y - nearestY;
      const dist2 = dx * dx + dy * dy;
      if (dist2 > ball.r * ball.r) return null;

      if (dist2 > 1e-6) {
        const n = normalize(dx, dy);
        return { nx: n.x, ny: n.y, px: nearestX, py: nearestY, penetration: ball.r - Math.sqrt(dist2) + 0.2 };
      }

      const leftPen = Math.abs(ball.x - b.x);
      const rightPen = Math.abs(ball.x - (b.x + b.w));
      const topPen = Math.abs(ball.y - b.y);
      const bottomPen = Math.abs(ball.y - (b.y + b.h));
      const minPen = Math.min(leftPen, rightPen, topPen, bottomPen);
      if (minPen === leftPen) return { nx: -1, ny: 0, px: b.x, py: ball.y, penetration: ball.r + minPen + 0.25 };
      if (minPen === rightPen) return { nx: 1, ny: 0, px: b.x + b.w, py: ball.y, penetration: ball.r + minPen + 0.25 };
      if (minPen === topPen) return { nx: 0, ny: -1, px: ball.x, py: b.y, penetration: ball.r + minPen + 0.25 };
      return { nx: 0, ny: 1, px: ball.x, py: b.y + b.h, penetration: ball.r + minPen + 0.25 };
    }

    function getCircleBrickCollision(b) {
      const cx = b.x + b.w / 2;
      const cy = b.y + b.h / 2;
      const rr = Math.min(b.w, b.h) * 0.48;
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > rr + ball.r) return null;
      const n = dist > 1e-6 ? { x: dx / dist, y: dy / dist } : { x: 0, y: -1 };
      return { nx: n.x, ny: n.y, px: cx + n.x * rr, py: cy + n.y * rr, penetration: rr + ball.r - dist + 0.25 };
    }

    function triangleVertices(b) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const base = [
        { x: 0, y: -b.h / 2 },
        { x: b.w / 2, y: b.h / 2 },
        { x: -b.w / 2, y: b.h / 2 }
      ];
      const cs = Math.cos(b.rotation), sn = Math.sin(b.rotation);
      return base.map(p => ({ x: cx + p.x * cs - p.y * sn, y: cy + p.x * sn + p.y * cs }));
    }

    function getTriangleBrickCollision(b) {
      const vertices = triangleVertices(b);
      const inside = pointInTriangle(ball.x, ball.y, vertices[0], vertices[1], vertices[2]);
      let nearest = null;
      for (let i = 0; i < 3; i++) {
        const a = vertices[i], c = vertices[(i + 1) % 3];
        const cp = closestPointOnSegment(ball.x, ball.y, a.x, a.y, c.x, c.y);
        const dx = ball.x - cp.x, dy = ball.y - cp.y;
        const d2 = dx * dx + dy * dy;
        if (nearest === null || d2 < nearest.d2) {
          let n = normalize(c.y - a.y, a.x - c.x);
          // 外向きになるよう三角形の重心との内積で向きを決める。
          const gc = { x: b.x + b.w / 2, y: b.y + b.h / 6 };
          // 実際の重心は回転させた頂点平均。
          gc.x = (vertices[0].x + vertices[1].x + vertices[2].x) / 3;
          gc.y = (vertices[0].y + vertices[1].y + vertices[2].y) / 3;
          if (n.x * (gc.x - cp.x) + n.y * (gc.y - cp.y) > 0) n = { x: -n.x, y: -n.y };
          nearest = { d2, px: cp.x, py: cp.y, edgeNormal: n };
        }
      }
      if (!inside && nearest.d2 > ball.r * ball.r) return null;
      const dist = Math.sqrt(nearest.d2);
      let n;
      if (inside || dist < 1e-8) n = nearest.edgeNormal;
      else n = { x: (ball.x - nearest.px) / dist, y: (ball.y - nearest.py) / dist };
      return {
        nx: n.x, ny: n.y, px: nearest.px, py: nearest.py,
        penetration: (inside ? ball.r + dist : ball.r - dist) + 0.25
      };
    }

    function getBrickCollision(b) {
      if (b.shape === 'circle') return getCircleBrickCollision(b);
      if (b.shape === 'triangle') return getTriangleBrickCollision(b);
      return getRectCollision(b);
    }

    function collideBricks() {
      for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        const hit = getBrickCollision(b);
        if (!hit) continue;

        // 反射前に重なりを解消する。同一ブロックの連続ヒットを防ぐ。
        ball.x += hit.nx * hit.penetration;
        ball.y += hit.ny * hit.penetration;
        const approach = ball.vx * hit.nx + ball.vy * hit.ny;
        if (approach >= -0.001) continue;

        const out = reflect(ball.vx, ball.vy, hit.nx, hit.ny);
        ball.vx = out.vx;
        ball.vy = out.vy;
        keepBallSpeed();

        b.hp--;
        addScore(b.hp === 0 ? 10 * level : 5 * level);
        pop(hit.px, hit.py, b.color, b.hp === 0 ? 11 : 5);
        if (b.hp <= 0) bricks.splice(i, 1);
        return true;
      }
      return false;
    }

    function movePaddle(dt) {
      const oldX = paddle.x;
      const target = pointerX !== null
        ? clamp(pointerX - paddle.w / 2, 5, W - paddle.w - 5)
        : clamp(paddle.x + ((right ? 1 : 0) - (left ? 1 : 0)) * 580 * dt, 5, W - paddle.w - 5);
      const maxSpeed = pointerX !== null ? 1050 : 580;
      paddle.x = clamp(paddle.x + clamp(target - paddle.x, -maxSpeed * dt, maxSpeed * dt), 5, W - paddle.w - 5);
      return (paddle.x - oldX) / dt;
    }

    function update(dt) {
      particles = particles.filter(p => p.t < p.life);
      for (const p of particles) {
        p.t += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 160 * dt;
      }

      if (state !== 'playing') {
        movePaddle(dt);
        if (state === 'ready') {
          ball.x = paddle.x + paddle.w / 2;
          ball.y = paddle.y - ball.r - 1;
        }
        return;
      }

      // ボールと移動中のパドルを同じ小刻みな時間ステップで進める。
      const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
      const s = dt / steps;
      for (let j = 0; j < steps; j++) {
        const paddleVX = movePaddle(s);
        ball.x += ball.vx * s;
        ball.y += ball.vy * s;

        resolveWallCollision();
        collideBallPaddle(paddleVX);
        collideBricks();

        if (ball.y - ball.r > H) {
          lives--;
          pop(ball.x, H - 10, '#ff849b', 20);
          if (lives <= 0) state = 'gameover';
          else { state = 'ready'; resetBall(); }
          syncUI();
          break;
        }
        if (bricks.length === 0) {
          addScore(100 * level);
          nextLevel();
          break;
        }
      }

      trails.push({ x: ball.x, y: ball.y, t: 0 });
      if (trails.length > 12) trails.shift();
      for (const t of trails) t.t += dt;
    }

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    function ellipsePath(x, y, w, h) {
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    }

    function trianglePath(b) {
      const verts = triangleVertices(b);
      ctx.beginPath();
      ctx.moveTo(verts[0].x, verts[0].y);
      ctx.lineTo(verts[1].x, verts[1].y);
      ctx.lineTo(verts[2].x, verts[2].y);
      ctx.closePath();
    }

    function drawBrick(b) {
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 13;
      ctx.fillStyle = b.color;
      if (b.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) * .48, 0, Math.PI * 2);
      } else if (b.shape === 'triangle') trianglePath(b);
      else roundRectPath(b.x, b.y, b.w, b.h, 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff65';
      ctx.beginPath();
      ctx.arc(b.x + b.w * .38, b.y + b.h * .28, 2.6, 0, Math.PI * 2);
      ctx.fill();
      if (b.hp > 1) {
        ctx.strokeStyle = '#ffffffb0';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 4.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPaddle() {
      ctx.save();
      ctx.shadowColor = '#5de9e2';
      ctx.shadowBlur = 22;

      const grad = ctx.createRadialGradient(
        paddle.x + paddle.w * 0.45, paddle.y + paddle.h * 0.35, paddle.w * 0.08,
        paddle.x + paddle.w * 0.5, paddle.y + paddle.h * 0.55, paddle.w * 0.65
      );
      grad.addColorStop(0, '#dcfffb');
      grad.addColorStop(0.42, '#8af2ea');
      grad.addColorStop(1, '#2da9c9');
      ctx.fillStyle = grad;
      ellipsePath(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff55';
      ellipsePath(paddle.x + paddle.w * 0.16, paddle.y + paddle.h * 0.14, paddle.w * 0.34, paddle.h * 0.24);
      ctx.fill();

      ctx.strokeStyle = '#d7ffff80';
      ctx.lineWidth = 1.2;
      ellipsePath(paddle.x + 1, paddle.y + 1, paddle.w - 2, paddle.h - 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawBall() {
      if (state === 'playing' || state === 'ready') {
        for (let i = 0; i < trails.length; i++) {
          const t = trails[i];
          ctx.fillStyle = `rgba(103,236,232,${(i / trails.length) * .22})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, ball.r * (.3 + i / trails.length * .55), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.shadowColor = '#c1fbff';
      ctx.shadowBlur = 22;
      ctx.fillStyle = '#f4ffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawOverlay() {
      if (state === 'playing') return;
      ctx.fillStyle = '#071225bd';
      ctx.fillRect(0, 0, W, H);
      let title = '';
      let hint = '';
      let small = '';
      if (state === 'ready') {
        title = level === 1 && score === 0 ? 'READY?' : `LEVEL ${level}`;
        hint = 'スペース / クリックでスタート';
        small = '図形ブロックを全部消そう';
      }
      if (state === 'paused') {
        title = 'PAUSED';
        hint = 'スペース / クリックで再開';
      }
      if (state === 'gameover') {
        title = 'GAME OVER';
        hint = 'クリックでリトライ';
        small = `SCORE ${score.toLocaleString('ja-JP')}`;
      }
      if (state === 'won') {
        title = 'CLEAR!';
        hint = 'クリックでリトライ';
        small = `SCORE ${score.toLocaleString('ja-JP')}`;
      }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f2fbff';
      ctx.font = '800 49px system-ui, sans-serif';
      ctx.fillText(title, W / 2, H / 2 - 22);
      ctx.font = '600 21px system-ui, sans-serif';
      ctx.fillStyle = '#7deae5';
      ctx.fillText(hint, W / 2, H / 2 + 23);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = '#b6c7e4';
      ctx.fillText(small, W / 2, H / 2 + 57);
    }

    function draw() {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#101c36');
      bg.addColorStop(1, '#0a1427');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = '#29416938';
      ctx.lineWidth = 1;
      for (let x = 20; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 20; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      for (const s of stars) {
        ctx.fillStyle = '#96c8ff55';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const b of bricks) drawBrick(b);
      drawPaddle();
      drawBall();

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawOverlay();
    }

    function frame(now) {
      const dt = last ? Math.min((now - last) / 1000, .033) : 1 / 60;
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function position(e) {
      const r = canvas.getBoundingClientRect();
      pointerX = clamp((e.clientX - r.left) / r.width * W, 0, W);
    }

    canvas.addEventListener('pointermove', e => { position(e); });
    canvas.addEventListener('pointerdown', e => {
      position(e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      if (state !== 'playing') start();
    });
    canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointerX = null; });

    window.addEventListener('keydown', e => {
      if (['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyP','KeyR'].includes(e.code)) e.preventDefault();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { left = true; pointerX = null; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { right = true; pointerX = null; }
      if (e.code === 'Space') {
        if (state === 'playing') togglePause();
        else start();
      }
      if (e.code === 'KeyP') togglePause();
      if (e.code === 'KeyR') restart();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') right = false;
    });
    window.addEventListener('blur', () => {
      left = false;
      right = false;
      if (state === 'playing') {
        state = 'paused';
        syncUI();
      }
    });

    els.start.addEventListener('click', () => {
      if (state === 'playing') return;
      start();
    });
    els.pause.addEventListener('click', togglePause);
    els.reset.addEventListener('click', restart);

    updatePaddleShape();
    restart();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
