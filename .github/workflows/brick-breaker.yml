name: Brick Breaker Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    name: Rebuild historical versions and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize before generating output
        run: git pull --rebase origin main
      - name: Assemble original historical HTML snapshots
        run: node scripts/build-site.cjs
      - name: Regression tests (physics, gallery, archived scripts)
        run: |
          node tests/game.test.cjs
          node tests/orbit.test.cjs
          node tests/orbit-paddle.test.cjs
          node tests/orbit-v6.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: neon-break-versions
          path: |
            index.html
            games/
      - name: Commit four playable HTML snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/
          if ! git diff --cached --quiet; then
            git commit -m 'build: archive four tested playable versions'
            git push origin HEAD:main
          fi
