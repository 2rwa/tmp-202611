name: NDLOCR-Lite v2 browser regression
on:
  push:
    branches: [main, 'feat/ndlocr-*']
    paths: ['ndlocr-lite-v2/**', '.github/workflows/ndlocr-lite-v2.yml']
  pull_request:
    paths: ['ndlocr-lite-v2/**', '.github/workflows/ndlocr-lite-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check ndlocr-lite-v2/app.mjs
          node --check ndlocr-lite-v2/regression.cjs
          node ndlocr-lite-v2/logic.test.mjs
          node ndlocr-lite-v2/table.test.mjs
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1 pdf-lib@1.17.1 pdfjs-dist@4.10.38 adm-zip@0.5.16
          npx playwright install --with-deps chromium
      - run: node ndlocr-lite-v2/smoke.cjs
      - name: Feature regression matrix
        if: always()
        run: node ndlocr-lite-v2/regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndlocr-smoke-${{ github.run_attempt }}
          path: |
            ndlocr-smoke.png
            ndlocr-regression/
          if-no-files-found: ignore
