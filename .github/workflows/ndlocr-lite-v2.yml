name: NDLOCR-Lite v2 browser smoke
on:
  push:
    branches: [main]
    paths: ['ndlocr-lite-v2/**', '.github/workflows/ndlocr-lite-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ndlocr-lite-v2/app.mjs
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node ndlocr-lite-v2/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndlocr-smoke
          path: ndlocr-smoke.png
          if-no-files-found: ignore
