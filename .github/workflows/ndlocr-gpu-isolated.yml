name: NDLOCR isolated Mac GPU development
on:
  push:
    branches: ['gpu/ndlocr-mac']
    paths: ['ndlocr-lite-v2/**', '.github/workflows/ndlocr-gpu-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ndlocr-isolated-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install onnx==1.19.1 onnxruntime==1.23.2 numpy
          python ndlocr-lite-v2/patch-deim.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-detector-${{ github.run_attempt }}
          path: |
            ndlocr-lite-v2/det-patched.onnx
            ndlocr-lite-v2/det-patch.json
          if-no-files-found: error
  patched-gpu:
    needs: patch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-detector-${{ github.run_attempt }}
          path: ndlocr-lite-v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "ORT_VERSION=$(npm view onnxruntime-web version)" >> "$GITHUB_ENV"
      - name: Patched detector GPU correctness
        env:
          DET_PATCH: '1'
          DEBUG: pw:browser
        run: node ndlocr-lite-v2/webgpu-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-gpu-${{ github.run_attempt }}
          path: ndlocr-gpu-proof/
  browser-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check ndlocr-lite-v2/app.mjs
          node --check ndlocr-lite-v2/benchmark-ui.test.cjs
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser benchmark UI (WASM baseline, no GPU available)
        run: node ndlocr-lite-v2/benchmark-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-browser-benchmark
          path: |
            ndlocr-lite-v2/index.html
            ndlocr-lite-v2/app.mjs
            ndlocr-lite-v2/ocr-logic.mjs
            ndlocr-lite-v2/table-logic.mjs
            ndlocr-lite-v2/GPU-DEVELOPMENT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-ui-proof
          path: benchmark-ui-proof/
