name: NDLOCR isolated Mac GPU development
on:
  push:
    branches: ['gpu/ndlocr-mac']
    paths: ['ndlocr-lite-v2/**', '.github/workflows/ndlocr-gpu-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ndlocr-isolated-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verified runtime, original models
        env:
          ORT_VERSION: '1.31.1'
          ORT_OPT: 'all'
          DEBUG: pw:browser
        run: node ndlocr-lite-v2/webgpu-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-gpu-1.31.1
          path: ndlocr-gpu-proof/
  browser-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check ndlocr-lite-v2/app.mjs
          node --check ndlocr-lite-v2/benchmark-ui.test.cjs
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser benchmark UI (WASM baseline, no GPU available)
        run: node ndlocr-lite-v2/benchmark-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-browser-benchmark
          path: |
            ndlocr-lite-v2/index.html
            ndlocr-lite-v2/app.mjs
            ndlocr-lite-v2/ocr-logic.mjs
            ndlocr-lite-v2/table-logic.mjs
            ndlocr-lite-v2/GPU-DEVELOPMENT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-ui-proof
          path: benchmark-ui-proof/
