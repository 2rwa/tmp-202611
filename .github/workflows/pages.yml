name: Publish NEON BREAK to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - games/**
      - packed/**
      - scripts/**
      - tests/**
      - orbit/**
      - translate/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble all four historical HTML versions
        run: node scripts/build-site.cjs
      - name: Test gallery, archived games and physics
        run: node tests/game.test.cjs
      - name: Physics and gameplay model regressions
        run: |
          node tests/orbit.test.cjs
          node tests/orbit-paddle.test.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 esbuild@0.25.12 @wllama/wllama@3.8.1
          npx playwright install --with-deps chromium
      - name: Test UI and real gameplay in Chromium
        run: node tests/orbit.browser.cjs
      - name: Test PFML3 prompts and glossary
        run: node tests/translate.test.cjs
      - name: Build translator regression bundle
        run: node scripts/build-translate.cjs --mock
      - name: Test translation UI in real Chromium
        run: node tests/translate.browser.cjs
      - name: Verify GitHub Star buttons in Chromium
        run: node tests/github-star.browser.cjs
      - name: Find latest successfully tested PLaMo runtime
        id: verified
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/plamo-upstream.yml/runs?status=success&per_page=30")
          run_id=$(printf '%s' "$response" | jq -r '.workflow_runs[] | select(.head_branch == "main") | .id' | head -n 1)
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download tested PLaMo JavaScript and WebAssembly
        uses: actions/download-artifact@v4
        with:
          name: plamo-upstream-runtime-and-e2e
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Save screenshots from real browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-proof
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r games dist/games
          cp -r orbit dist/orbit
          # The mock UI test has already populated dist/translate.
          # Remove it so the verified model bundle is copied to the correct location.
          rm -rf dist/translate
          if [ -d downloaded/dist/translate ]; then
            cp -r downloaded/dist/translate dist/translate
          elif [ -d downloaded/translate ]; then
            cp -r downloaded/translate dist/translate
          else
            echo 'No verified PLaMo runtime artifact found' >&2
            exit 1
          fi
          # Keep the tested JavaScript/WASM, but use the current page UI and Star button.
          cp translate/index.html dist/translate/index.html
          cp translate/style.css dist/translate/style.css
          grep -q 'class="github-button"' dist/index.html
          grep -q 'class="github-button"' dist/translate/index.html
          test -s dist/games/v5-orbit.html
          test -s dist/orbit/physics.js
          touch dist/.nojekyll
          test -s dist/games/v1-classic.html
          test -s dist/games/v4-speed.html
          test -s dist/translate/app.js
          test -s dist/translate/wasm/wllama.wasm
          test -s dist/translate/compat/wllama.js
          test -s dist/translate/compat/wllama.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
