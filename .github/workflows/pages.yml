name: Publish NEON BREAK to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - games/**
      - packed/**
      - scripts/**
      - tests/**
      - orbit/**
      - translate/**
      - geo-mcp/**
      - fm-lab/**
      - ndlocr-lite-v2/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy archive
    # Playwright 1.56.1 cannot install Chromium on Ubuntu 26.04.
    # GitHub migrated ubuntu-latest to 26.04 in November 2026.
    # Keep 24.04 until the pinned Playwright/browser tests are upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine whether only OCR changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          echo 'ocr_only=false' >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != push ] || [ -z "$BEFORE" ]; then exit 0; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE" || exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if printf '%s\n' "$changed" | grep -q '^ndlocr-lite-v2/' && ! printf '%s\n' "$changed" | grep -Evq '^(ndlocr-lite-v2/|\.github/workflows/pages\.yml$|scripts/reuse-pages-artifact\.sh$)'; then
            echo 'ocr_only=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble all four historical HTML versions
        if: steps.scope.outputs.ocr_only != 'true'
        run: node scripts/build-site.cjs
      - name: Test gallery, archived games and physics
        if: steps.scope.outputs.ocr_only != 'true'
        run: node tests/game.test.cjs
      - name: Physics and gameplay model regressions
        if: steps.scope.outputs.ocr_only != 'true'
        run: |
          node tests/orbit.test.cjs
          node tests/orbit-paddle.test.cjs
          node tests/orbit-v6.test.cjs
      - name: Install headless Chromium
        if: steps.scope.outputs.ocr_only != 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 esbuild@0.25.12 @wllama/wllama@3.8.1
          npx playwright install --with-deps chromium
      - name: Test UI and real gameplay in Chromium
        if: steps.scope.outputs.ocr_only != 'true'
        run: |
          node tests/orbit.browser.cjs
          node tests/orbit-v6.browser.cjs
          node tests/orbit-v6-stages.browser.cjs
      - name: Test MLIT MCP mock and JS syntax
        if: steps.scope.outputs.ocr_only != 'true'
        run: |
          node tests/geo-mcp.test.cjs
          node --check geo-mcp/app.js
      - name: Test FM synthesis and analytic gradient optimization
        if: steps.scope.outputs.ocr_only != 'true'
        run: |
          node tests/fm-lab.test.mjs
          node --check fm-lab/app.mjs
          node --check fm-lab/audio-worklet.mjs
          node --check fm-lab/fit-worker.mjs
      - name: Test FM Lab in Chromium
        if: steps.scope.outputs.ocr_only != 'true'
        run: node tests/fm-lab.browser.cjs
      # NDLOCR is tested independently by ndlocr-lite-v2.yml; failures must not block experimental Pages releases.
      - name: Test PFML3 prompts and glossary
        if: steps.scope.outputs.ocr_only != 'true'
        run: node tests/translate.test.cjs
      - name: Build translator regression bundle
        if: steps.scope.outputs.ocr_only != 'true'
        run: node scripts/build-translate.cjs --mock
      - name: Test translation UI in real Chromium
        if: steps.scope.outputs.ocr_only != 'true'
        run: node tests/translate.browser.cjs
      - name: Verify GitHub Star buttons in Chromium
        if: steps.scope.outputs.ocr_only != 'true'
        run: node tests/github-star.browser.cjs
      - name: Find latest native macOS Safari-verified PLaMo runtime
        if: steps.scope.outputs.ocr_only != 'true'
        id: verified
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/plamo-macos-safari.yml/runs?status=success&per_page=30")
          run_id=''
          for candidate in $(printf '%s' "$response" | jq -r '.workflow_runs[] | select(.head_branch == "main") | .id'); do
            artifacts=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts")
            if printf '%s' "$artifacts" | jq -e '.artifacts[] | select(.name == "plamo-safari-verified-runtime" and .expired == false)' >/dev/null; then
              run_id=$candidate
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo 'No native Safari-verified runtime exists yet; preserve current Pages deployment.'
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - name: Download native Safari-verified PLaMo JavaScript and WebAssembly
        if: steps.scope.outputs.ocr_only != 'true' && steps.verified.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plamo-safari-verified-runtime
          repository: ${{ github.repository }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Reuse last successfully published Pages artifact if no Safari runtime is available
        if: steps.scope.outputs.ocr_only != 'true' && steps.verified.outputs.available != 'true'
        id: previous_site
        env:
          API_TOKEN: ${{ github.token }}
        run: bash scripts/reuse-pages-artifact.sh
      - name: Save screenshots from real browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-proof
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Checkout pinned independent OCR GPU benchmark
        if: steps.scope.outputs.ocr_only != 'true'
        uses: actions/checkout@v4
        with:
          ref: cd7abd26ad4b901d1675fd4972ae68ecb890caf3
          path: gpu-preview-src
          persist-credentials: false
      - name: Restore complete published site for OCR-only changes
        if: steps.scope.outputs.ocr_only == 'true'
        id: ocr_site
        env:
          API_TOKEN: ${{ github.token }}
          REQUIRE_FULL_SITE: 'true'
        run: bash scripts/reuse-pages-artifact.sh
      - name: Overlay OCR only, retaining every other published file
        if: steps.ocr_site.outputs.available == 'true'
        run: |
          mkdir -p dist
          cp -a downloaded/previous-site/. dist/
          rm -rf dist/ndlocr-lite-v2
          mkdir -p dist/ndlocr-lite-v2
          cp ndlocr-lite-v2/{index.html,app.mjs,ocr-logic.mjs,table-logic.mjs,document-io.mjs,daisy.mjs} dist/ndlocr-lite-v2/
          printf '%s\n' "$GITHUB_SHA" > dist/ndlocr-lite-v2/source-commit.txt
          for f in dist/ndlocr-lite-v2/*.mjs; do node --check "$f"; done
          diff -qr --exclude=ndlocr-lite-v2 downloaded/previous-site dist
      - name: Prepare static site
        if: steps.scope.outputs.ocr_only != 'true' && (steps.verified.outputs.available == 'true' || steps.previous_site.outputs.available == 'true')
        env:
          VERIFIED: ${{ steps.verified.outputs.available }}
          PREVIOUS: ${{ steps.previous_site.outputs.available }}
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r games dist/games
          cp -r orbit dist/orbit
          cp -r geo-mcp dist/geo-mcp
          cp -r fm-lab dist/fm-lab
          mkdir -p dist/ndlocr-lite-v2
          cp ndlocr-lite-v2/{index.html,app.mjs,ocr-logic.mjs,table-logic.mjs,document-io.mjs,daisy.mjs} dist/ndlocr-lite-v2/
          printf '%s\n' "$GITHUB_SHA" > dist/ndlocr-lite-v2/source-commit.txt
          mkdir -p dist/ndlocr-gpu
          cp gpu-preview-src/ndlocr-lite-v2/{index.html,app.mjs,ocr-logic.mjs,table-logic.mjs} dist/ndlocr-gpu/
          printf '%s\n' 'cd7abd26ad4b901d1675fd4972ae68ecb890caf3' > dist/ndlocr-gpu/source-commit.txt
          # Preserve the last successfully published translator if native Safari
          # validation has not produced a new runtime. Never deploy the mock.
          rm -rf dist/translate
          if [ "$VERIFIED" = 'true' ]; then
            if [ -d downloaded/dist/translate ]; then
              cp -r downloaded/dist/translate dist/translate
            elif [ -d downloaded/translate ]; then
              cp -r downloaded/translate dist/translate
            else
              echo 'No verified PLaMo runtime artifact found' >&2
              exit 1
            fi
            cp translate/index.html dist/translate/index.html
            cp translate/style.css dist/translate/style.css
            sed -i "s|src=\"./app.js\"|src=\"./app.js?v=${GITHUB_SHA}\"|" dist/translate/index.html
          elif [ "$PREVIOUS" = 'true' ]; then
            cp -r downloaded/previous-site/translate dist/translate
          else
            echo 'No safe translator assets available; do not overwrite Pages' >&2
            exit 1
          fi
          grep -q 'class="github-button"' dist/index.html
          grep -q 'class="github-button"' dist/translate/index.html
          test -s dist/games/v5-orbit.html
          test -s dist/games/v6-orbit.html
          test -s dist/orbit/v6-physics.js
          test -s dist/orbit/physics.js
          touch dist/.nojekyll
          test -s dist/games/v1-classic.html
          test -s dist/games/v4-speed.html
          test -s dist/translate/app.js
          test -s dist/geo-mcp/index.html
          test -s dist/geo-mcp/app.js
          test -s dist/fm-lab/index.html
          test -s dist/fm-lab/audio-worklet.mjs
          test -s dist/translate/wasm/wllama.wasm
          test -s dist/translate/compat/wllama.js
          test -s dist/translate/compat/wllama.wasm
      - uses: actions/configure-pages@v5
        if: steps.ocr_site.outputs.available == 'true' || steps.verified.outputs.available == 'true' || steps.previous_site.outputs.available == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.ocr_site.outputs.available == 'true' || steps.verified.outputs.available == 'true' || steps.previous_site.outputs.available == 'true'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          retention-days: 30
      - name: Wait for Pages artifact metadata visibility
        if: steps.ocr_site.outputs.available == 'true' || steps.verified.outputs.available == 'true' || steps.previous_site.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 18); do
            response=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100") || response='{"artifacts":[]}'
            count=$(printf '%s' "$response" | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length')
            if [ "$count" = 1 ]; then echo "Pages artifact is visible: $ARTIFACT_NAME"; exit 0; fi
            echo "Waiting for artifact metadata ($i/18): $count"
            sleep 5
          done
          echo "Pages artifact metadata not uniquely visible" >&2
          exit 1
      # The REST list can see the artifact before the deploy action's list.
      # Retry the same upload, never upload a second artifact in this job.
      - name: Deploy to GitHub Pages
        if: steps.ocr_site.outputs.available == 'true' || steps.verified.outputs.available == 'true' || steps.previous_site.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
